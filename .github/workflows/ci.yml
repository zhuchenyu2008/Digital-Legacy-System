name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    name: Full acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      mailpit:
        image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
        env:
          MP_MAX_MESSAGES: "5000"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8025/readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run complete acceptance
        run: pnpm acceptance

      - name: Upload acceptance diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .acceptance-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  production-images:
    name: Production image build
    needs: acceptance
    if: ${{ needs.acceptance.result == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production images after acceptance
        run: |
          docker buildx build --load --target api --tag dls-api:${{ github.sha }} .
          docker buildx build --load --target worker --tag dls-worker:${{ github.sha }} .
          docker buildx build --load --target web --tag dls-web:${{ github.sha }} .
          docker buildx build --load --target caddy --tag dls-caddy:${{ github.sha }} .
