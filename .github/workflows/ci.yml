name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  release-images:
    name: Build immutable release images once
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR for production releases
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build release images and record exact digests
        env:
          RELEASE_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          mkdir -p .acceptance-artifacts
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PUSH_FLAG=--push
          else
            PUSH_FLAG=--load
          fi
          node ops/scripts/build-release-images.mjs --registry "$RELEASE_REGISTRY" --tag "${{ github.sha }}" --output .acceptance-artifacts/release-image-manifest.json "$PUSH_FLAG"
          node ops/scripts/verify-image-manifest.mjs .acceptance-artifacts/release-image-manifest.json

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-manifest-${{ github.sha }}
          path: .acceptance-artifacts/release-image-manifest.json
          if-no-files-found: error

  acceptance:
    name: Full acceptance
    needs: release-images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      mailpit:
        image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
        env:
          MP_MAX_MESSAGES: "5000"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8025/readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify the exact image manifest used for this release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image-manifest-${{ github.sha }}
          path: .acceptance-artifacts

      - name: Verify immutable release image digests
        run: node ops/scripts/verify-image-manifest.mjs .acceptance-artifacts/release-image-manifest.json

      - name: Run complete acceptance
        run: pnpm acceptance

      - name: Upload acceptance diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .acceptance-artifacts/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
