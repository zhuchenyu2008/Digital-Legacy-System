name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    name: Full acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete acceptance
        run: pnpm acceptance

  production-images:
    name: Production image build
    needs: acceptance
    if: ${{ needs.acceptance.result == 'success' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production images after acceptance
        run: |
          docker buildx build --load --target api --tag dls-api:${{ github.sha }} .
          docker buildx build --load --target worker --tag dls-worker:${{ github.sha }} .
          docker buildx build --load --target web --tag dls-web:${{ github.sha }} .
          docker buildx build --load --target caddy --tag dls-caddy:${{ github.sha }} .
