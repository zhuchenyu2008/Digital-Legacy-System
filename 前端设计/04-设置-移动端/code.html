econdary text-[12px]">SSL</p></div></div><span class="material-symbols-outlined text-text-secondary opacity-50">chevron_right</span></button><button class="w-full flex items-center justify-between px-4 py-4 hover:bg-surface-container-low transition-colors active:bg-surface-dim"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-text-secondary">person</span><div class="text-left"><p class="font-body-md text-body-md text-text-primary">用户名</p><p class="font-label-mono text-label-mono text-text-secondary text-[12px]">apikey</p></div></div><span class="material-symbols-outlined text-text-secondary opacity-50">chevron_right</span></button><button class="w-full flex items-center justify-between px-4 py-4 hover:bg-surface-container-low transition-colors active:bg-surface-dim"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-text-secondary">key</span><div class="text-left"><p class="font-body-md text-body-md text-text-primary">密码 / API Key</p><p class="font-label-mono text-label-mono text-text-secondary text-[12px]">••••••••</p></div></div><span class="material-symbols-outlined text-text-secondary opacity-50">chevron_right</span></button><button class="w-full flex items-center justify-center px-4 py-4 hover:bg-surface-container-low transition-colors active:bg-surface-dim text-primary font-bold gap-2"><span class="material-symbols-outlined text-[18px]">send</span>发送测试邮件</button></div></section>
