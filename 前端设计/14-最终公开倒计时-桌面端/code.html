<script>
        // Simple mock countdown timer for visual effect
        document.addEventListener('DOMContentLoaded', () => {
            const countdownEl = document.getElementById('countdown');
            let hours = 23;
            let minutes = 59;
            let seconds = 59;

            setInterval(() => {
                seconds--;
                if (seconds < 0) {
                    seconds = 59;
                    minutes--;
                    if (minutes < 0) {
                        minutes = 59;
                        hours--;
                    }
                }
                const displayH = hours.toString().padStart(2, '0');
                const displayM = minutes.toString().padStart(2, '0');
                const displayS = seconds.toString().padStart(2, '0');
                countdownEl.textContent = `${displayH}:${displayM}:${displayS}`;
            }, 1000);
        });
    </script>
