name: dls-local-v1

x-build-args: &build-args
  NODE_IMAGE: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
  GO_IMAGE: golang:1.24.8-bookworm@sha256:4ed690d6649d63c312b99a6120025ec79ce3b542968a37da53d6236c7c61a848
  CADDY_IMAGE: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648

x-application-environment: &application-environment
  NODE_ENV: production
  PUBLIC_BASE_URL: http://localhost:${DLS_HTTP_PORT:-8080}
  MAIL_TRANSPORT_URL: smtp://mailpit:1025
  MAIL_FROM: Digital Legacy System <no-reply@dls.local>
  TRUSTED_PROXY_HOPS: "1"
  DEBUG: "false"
  RUNNING_IN_CONTAINER: "true"
  STORAGE_DRIVER: ${DLS_STORAGE_DRIVER:-filesystem}
  STORAGE_PRIVATE_ROOT: /var/lib/dls/objects/private
  STORAGE_STAGING_ROOT: /var/lib/dls/objects/staging
  STORAGE_PUBLIC_ROOT: /var/lib/dls/objects/public
  S3_ENDPOINT: ${DLS_S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${DLS_S3_REGION:-us-east-1}
  S3_PRIVATE_BUCKET: ${DLS_S3_PRIVATE_BUCKET:-dls-private}
  S3_PUBLIC_BUCKET: ${DLS_S3_PUBLIC_BUCKET:-dls-public}
  S3_FORCE_PATH_STYLE: "true"

x-node-service: &node-service
  restart: unless-stopped
  init: true
  read_only: true
  user: "1000:1000"
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    environment:
      POSTGRES_DB: dls
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    secrets:
      - postgres_superuser_password
      - api_db_password
      - worker_db_password
      - migrator_db_password
      - backup_db_password
      - health_db_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./ops/postgres/init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres --dbname dls"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    restart: unless-stopped
    read_only: true
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    volumes:
      - mailpit_data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    <<: *node-service
    build:
      context: .
      target: api
      args: *build-args
    environment:
      <<: *application-environment
      API_PORT: "3001"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export SESSION_SECRET="$$(cat /run/secrets/session_secret)"
        export TOKEN_PEPPER="$$(cat /run/secrets/token_pepper)"
        export DATABASE_URL="postgresql://dls_api:$$(cat /run/secrets/api_db_password)@postgres:5432/dls"
        if [ "$$STORAGE_DRIVER" = s3 ]; then
          export S3_ACCESS_KEY_ID="$$(cat /run/dls-s3-secrets/minio-access-key)"
          export S3_SECRET_ACCESS_KEY="$$(cat /run/dls-s3-secrets/minio-secret-key)"
        fi
        exec node apps/api/dist/main.js
    secrets:
      - session_secret
      - token_pepper
      - api_db_password
    volumes:
      - private_objects:/var/lib/dls/objects/private
      - staging_objects:/var/lib/dls/objects/staging
      - public_objects:/var/lib/dls/objects/public
      - ${DLS_SECRETS_DIR:-./ops/secrets/generated}:/run/dls-s3-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    <<: *node-service
    build:
      context: .
      target: worker
      args: *build-args
    environment: *application-environment
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export SESSION_SECRET="$$(cat /run/secrets/session_secret)"
        export TOKEN_PEPPER="$$(cat /run/secrets/token_pepper)"
        export DATABASE_URL="postgresql://dls_worker:$$(cat /run/secrets/worker_db_password)@postgres:5432/dls"
        if [ "$$STORAGE_DRIVER" = s3 ]; then
          export S3_ACCESS_KEY_ID="$$(cat /run/dls-s3-secrets/minio-access-key)"
          export S3_SECRET_ACCESS_KEY="$$(cat /run/dls-s3-secrets/minio-secret-key)"
        fi
        exec node apps/worker/dist/main.js
    secrets:
      - session_secret
      - token_pepper
      - worker_db_password
    volumes:
      - private_objects:/var/lib/dls/objects/private
      - staging_objects:/var/lib/dls/objects/staging
      - public_objects:/var/lib/dls/objects/public
      - ${DLS_SECRETS_DIR:-./ops/secrets/generated}:/run/dls-s3-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    <<: *node-service
    build:
      context: .
      target: web
      args: *build-args
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  caddy:
    build:
      context: .
      target: caddy
      args: *build-args
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    ports:
      - 127.0.0.1:${DLS_HTTP_PORT:-8080}:8080
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - public_objects:/srv/public:ro
    tmpfs:
      - /config:size=16m,mode=0700
      - /data:size=32m,mode=0700
      - /tmp:size=16m,mode=1777
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio:
    profiles: ["s3"]
    build:
      context: .
      target: minio
      args:
        <<: *build-args
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
        MINIO_SOURCE_SHA256: 45521908307306e925c98d629e1c17d78c8b72b6ee242b1bfb1409f7d8ee5841
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_access_key)"
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_secret_key)"
        exec minio server /data --address :9000 --console-address :9001
    secrets:
      - minio_access_key
      - minio_secret_key
    volumes:
      - minio_data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/minio/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio-init:
    profiles: ["s3"]
    build:
      context: .
      target: test
      args: *build-args
    read_only: true
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/minio_access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_secret_key)"
        exec node ops/scripts/init-minio-buckets.mjs
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${DLS_S3_REGION:-us-east-1}
      S3_PRIVATE_BUCKET: ${DLS_S3_PRIVATE_BUCKET:-dls-private}
      S3_PUBLIC_BUCKET: ${DLS_S3_PUBLIC_BUCKET:-dls-public}
    secrets:
      - minio_access_key
      - minio_secret_key
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      minio:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  acceptance:
    profiles: ["test"]
    build:
      context: .
      target: test
      args: *build-args
    read_only: true
    user: "1000:1000"
    environment:
      <<: *application-environment
      DATABASE_URL: postgresql://dls_api@postgres:5432/dls
    command: ["pnpm", "acceptance"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      caddy:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  storage-tests:
    profiles: ["test", "s3"]
    build:
      context: .
      target: test
      args: *build-args
    read_only: true
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export COREPACK_HOME=/tmp/corepack
        export DLS_S3_TEST=1
        export S3_ENDPOINT=http://minio:9000
        export S3_REGION="${DLS_S3_REGION:-us-east-1}"
        export S3_PRIVATE_BUCKET="${DLS_S3_PRIVATE_BUCKET:-dls-private}"
        export S3_PUBLIC_BUCKET="${DLS_S3_PUBLIC_BUCKET:-dls-public}"
        export S3_FORCE_PATH_STYLE=true
        export S3_ACCESS_KEY_ID="$$(cat /run/secrets/minio_access_key)"
        export S3_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_secret_key)"
        exec pnpm --filter @dls/storage test
    secrets:
      - minio_access_key
      - minio_secret_key
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /workspace/packages/storage/node_modules/.vite-temp:size=16m,uid=1000,gid=1000,mode=1777
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  private_objects:
  staging_objects:
  public_objects:
  mailpit_data:
  minio_data:

secrets:
  postgres_superuser_password:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/postgres-superuser-password
  api_db_password:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/api-db-password
  worker_db_password:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/worker-db-password
  migrator_db_password:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/migrator-db-password
  backup_db_password:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/backup-db-password
  health_db_password:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/health-db-password
  session_secret:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/session-secret
  token_pepper:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/token-pepper
  minio_access_key:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/minio-access-key
  minio_secret_key:
    file: ${DLS_SECRETS_DIR:-./ops/secrets/generated}/minio-secret-key
