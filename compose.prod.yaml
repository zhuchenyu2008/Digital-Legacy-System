name: dls-prod-v1

services:
  postgres:
    ports: !override []
    volumes: !override
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/postgres:/var/lib/postgresql
      - ./ops/postgres/init/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  migrator:
    build: !reset null
    image: ${DLS_IMAGE_REGISTRY:?DLS_IMAGE_REGISTRY is required}/dls-api:${DLS_IMAGE_TAG:?DLS_IMAGE_TAG is required}@${DLS_API_IMAGE_DIGEST:?DLS_API_IMAGE_DIGEST is required}
    networks: [internal]

  api:
    build: !reset null
    image: ${DLS_IMAGE_REGISTRY:?DLS_IMAGE_REGISTRY is required}/dls-api:${DLS_IMAGE_TAG:?DLS_IMAGE_TAG is required}@${DLS_API_IMAGE_DIGEST:?DLS_API_IMAGE_DIGEST is required}
    environment:
      PUBLIC_BASE_URL: https://${DLS_DOMAIN:?DLS_DOMAIN is required}
      MAIL_TRANSPORT_URL: ${DLS_MAIL_TRANSPORT_URL:?DLS_MAIL_TRANSPORT_URL must be SMTPS or STARTTLS}
      MAIL_FROM: ${DLS_MAIL_FROM:?DLS_MAIL_FROM is required}
      CONTACT_CONSENT_VERSION: ${DLS_CONTACT_CONSENT_VERSION:?DLS_CONTACT_CONSENT_VERSION is required}
      CONTACT_CONSENT_SHA256: ${DLS_CONTACT_CONSENT_SHA256:?DLS_CONTACT_CONSENT_SHA256 is required}
      S3_ENDPOINT: "${DLS_S3_ENDPOINT:-}"
      S3_REGION: "${DLS_S3_REGION:-us-east-1}"
      S3_PRIVATE_BUCKET: "${DLS_S3_PRIVATE_BUCKET:-}"
      S3_STAGING_BUCKET: "${DLS_S3_STAGING_BUCKET:-}"
      S3_PUBLIC_BUCKET: "${DLS_S3_PUBLIC_BUCKET:-}"
      S3_FORCE_PATH_STYLE: "${DLS_S3_FORCE_PATH_STYLE:-false}"
      STORAGE_PRIVATE_ROOT: /var/lib/dls/objects/private
      STORAGE_STAGING_ROOT: /var/lib/dls/objects/staging
      STORAGE_PUBLIC_ROOT: /var/lib/dls/objects/public
    depends_on: !override
      postgres:
        condition: service_healthy
    volumes: !override
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/private:/var/lib/dls/objects/private
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/staging:/var/lib/dls/objects/staging
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/public:/var/lib/dls/objects/public
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  worker:
    build: !reset null
    image: ${DLS_IMAGE_REGISTRY:?DLS_IMAGE_REGISTRY is required}/dls-worker:${DLS_IMAGE_TAG:?DLS_IMAGE_TAG is required}@${DLS_WORKER_IMAGE_DIGEST:?DLS_WORKER_IMAGE_DIGEST is required}
    environment:
      PUBLIC_BASE_URL: https://${DLS_DOMAIN:?DLS_DOMAIN is required}
      MAIL_TRANSPORT_URL: ${DLS_MAIL_TRANSPORT_URL:?DLS_MAIL_TRANSPORT_URL must be SMTPS or STARTTLS}
      MAIL_FROM: ${DLS_MAIL_FROM:?DLS_MAIL_FROM is required}
      S3_ENDPOINT: "${DLS_S3_ENDPOINT:-}"
      S3_REGION: "${DLS_S3_REGION:-us-east-1}"
      S3_PRIVATE_BUCKET: "${DLS_S3_PRIVATE_BUCKET:-}"
      S3_STAGING_BUCKET: "${DLS_S3_STAGING_BUCKET:-}"
      S3_PUBLIC_BUCKET: "${DLS_S3_PUBLIC_BUCKET:-}"
      S3_FORCE_PATH_STYLE: "${DLS_S3_FORCE_PATH_STYLE:-false}"
    depends_on: !override
      postgres:
        condition: service_healthy
    volumes: !override
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/private:/var/lib/dls/objects/private
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/staging:/var/lib/dls/objects/staging
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/public:/var/lib/dls/objects/public
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  monitor:
    image: ${DLS_IMAGE_REGISTRY:?DLS_IMAGE_REGISTRY is required}/dls-api:${DLS_IMAGE_TAG:?DLS_IMAGE_TAG is required}@${DLS_API_IMAGE_DIGEST:?DLS_API_IMAGE_DIGEST is required}
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    environment:
      NODE_ENV: production
      MAIL_TRANSPORT_URL: ${DLS_MAIL_TRANSPORT_URL:?DLS_MAIL_TRANSPORT_URL must be SMTPS or STARTTLS}
      STORAGE_DRIVER: ${DLS_STORAGE_DRIVER:-filesystem}
      STORAGE_PRIVATE_ROOT: /var/lib/dls/objects/private
      STORAGE_STAGING_ROOT: /var/lib/dls/objects/staging
      STORAGE_PUBLIC_ROOT: /var/lib/dls/objects/public
      S3_ENDPOINT: "${DLS_S3_ENDPOINT:-}"
      S3_REGION: "${DLS_S3_REGION:-us-east-1}"
      S3_PRIVATE_BUCKET: "${DLS_S3_PRIVATE_BUCKET:-}"
      S3_STAGING_BUCKET: "${DLS_S3_STAGING_BUCKET:-}"
      S3_PUBLIC_BUCKET: "${DLS_S3_PUBLIC_BUCKET:-}"
      S3_FORCE_PATH_STYLE: "${DLS_S3_FORCE_PATH_STYLE:-false}"
      DLS_OPERATIONS_STATUS_DIR: /var/lib/dls/operations
      MONITOR_INTERVAL_MS: "${DLS_MONITOR_INTERVAL_MS:-60000}"
      WORKER_HEARTBEAT_STALE_MS: "${DLS_WORKER_HEARTBEAT_STALE_MS:-90000}"
      BACKUP_STALE_MS: "${DLS_BACKUP_STALE_MS:-129600000}"
      RESTORE_DRILL_STALE_MS: "${DLS_RESTORE_DRILL_STALE_MS:-691200000}"
      ALERT_COOLDOWN_MS: "${DLS_ALERT_COOLDOWN_MS:-3600000}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export DATABASE_URL="postgresql://dls_health:$$(cat /run/secrets/health_db_password)@postgres:5432/dls"
        export ALERT_WEBHOOK_URL="$$(cat /run/secrets/alert_webhook_url)"
        if [ "$$STORAGE_DRIVER" = s3 ]; then
          export S3_ACCESS_KEY_ID="$$(cat /run/secrets/minio_access_key)"
          export S3_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_secret_key)"
        fi
        exec node ops/scripts/production-monitor.mjs
    secrets:
      - health_db_password
      - alert_webhook_url
      - minio_access_key
      - minio_secret_key
    volumes:
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/private:/var/lib/dls/objects/private:ro
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/staging:/var/lib/dls/objects/staging:ro
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/public:/var/lib/dls/objects/public:ro
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/operations:/var/lib/dls/operations
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:fs').stat('/var/lib/dls/operations/monitor-status.json',(e,s)=>{if(e||Date.now()-s.mtimeMs>180000)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    build: !reset null
    image: ${DLS_IMAGE_REGISTRY:?DLS_IMAGE_REGISTRY is required}/dls-web:${DLS_IMAGE_TAG:?DLS_IMAGE_TAG is required}@${DLS_WEB_IMAGE_DIGEST:?DLS_WEB_IMAGE_DIGEST is required}
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    build: !reset null
    image: ${DLS_IMAGE_REGISTRY:?DLS_IMAGE_REGISTRY is required}/dls-caddy:${DLS_IMAGE_TAG:?DLS_IMAGE_TAG is required}@${DLS_CADDY_IMAGE_DIGEST:?DLS_CADDY_IMAGE_DIGEST is required}
    environment:
      DLS_DOMAIN: ${DLS_DOMAIN:?DLS_DOMAIN is required}
      DLS_TLS_EMAIL: ${DLS_TLS_EMAIL:?DLS_TLS_EMAIL is required}
    read_only: true
    user: "1000:1000"
    cap_drop: !override [ALL]
    security_opt: !override [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports: !override
      - target: 80
        published: "80"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: tcp
    volumes: !override
      - ./ops/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - ${DLS_DATA_DIR:?DLS_DATA_DIR is required}/objects/public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: !override
      - /tmp:size=16m,mode=1777
    networks: [internal]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  mailpit:
    profiles: [disabled]
  minio:
    profiles: [disabled]
  minio-init:
    profiles: [disabled]
  acceptance:
    profiles: [disabled]
  storage-tests:
    profiles: [disabled]

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge

secrets:
  postgres_superuser_password:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/postgres-superuser-password
  api_db_password:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/api-db-password
  worker_db_password:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/worker-db-password
  migrator_db_password:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/migrator-db-password
  backup_db_password:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/backup-db-password
  health_db_password:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/health-db-password
  session_secret:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/session-secret
  session_pepper:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/session-pepper
  setup_token:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/setup-token
  token_pepper:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/token-pepper
  contact_password_pepper:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/contact-password-pepper
  release_ingress_public_key:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/release-ingress-public-key
  release_ingress_private_key:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/release-ingress-private-key
  release_stage_kek:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/release-stage-kek
  recovery_ingress_public_key:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/recovery-ingress-public-key
  recovery_ingress_private_key:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/recovery-ingress-private-key
  recovery_stage_kek:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/recovery-stage-kek
  minio_access_key:
    file: ${DLS_S3_ACCESS_KEY_FILE:?DLS_S3_ACCESS_KEY_FILE is required}
  minio_secret_key:
    file: ${DLS_S3_SECRET_KEY_FILE:?DLS_S3_SECRET_KEY_FILE is required}
  alert_webhook_url:
    file: ${DLS_SECRETS_DIR:?DLS_SECRETS_DIR is required}/alert-webhook-url
